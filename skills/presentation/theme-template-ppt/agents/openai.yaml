interface:
  display_name: "Theme Template PPT"
  short_description: "Build template-based decks with master-layout mapping"
  default_prompt: "Use $theme-template-ppt to inspect slide masters on every run, auto-select and auto-create missing master layouts as needed, write JSON specs to files (not inline args), and build a final deck from assets/template.pptx in ~/.foundry_local_playground/outputs/pptx/<thread_id>/ while reusing the same directory within a thread."
