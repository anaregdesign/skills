interface:
  display_name: "Theme Template PPT"
  short_description: "Build template-based decks with master-layout mapping"
  default_prompt: "Use $theme-template-ppt to follow this order: organize per-slide claims first, inspect masters, run --suggest-layouts to review candidates, decide and lock layout_name/layout per slide, then rewrite content to fit selected placeholders. Keep scripts for deterministic tasks (ranking/build/lint) and keep semantic rewriting in LLM reasoning. Run scripts/ensure_workdir_key.bash first, write JSON specs to files (not inline args), optionally generate Mermaid visuals under $WORK_DIR/assets/generated/mermaid/, and build from assets/template.pptx in ~/.foundry_local_playground/outputs/pptx/<work_key>/ while reusing THEME_TEMPLATE_PPT_WORK_KEY within a thread."
